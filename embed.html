<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoClubs — exemple d'intégration</title>
<style>
  body{margin:0;padding:40px 20px;background:#f6f7fb;color:#14181f;
       font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:900px;margin:0 auto}
  h1{font-size:26px;margin:0 0 6px}
  p.sub{margin:0 0 28px;color:#5b6478}
  /* ─── le bloc à recopier dans votre page ─── */
  .geoclubs-embed{max-width:900px;margin:0 auto}
  .geoclubs-embed iframe{width:100%;height:900px;border:0;display:block;
    border-radius:18px;box-shadow:0 20px 50px -22px rgba(10,16,32,.55)}
  /* ───────────────────────────────────────── */
  code{background:#e9ecf3;padding:2px 6px;border-radius:5px;font-size:14px}
  footer{margin-top:28px;color:#7b8397;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Exemple d'intégration</h1>
  <p class="sub">Le jeu est encapsulé dans une <code>iframe</code> de 900&nbsp;px de large maximum et
     ajuste sa hauteur tout seul.</p>

  <div class="geoclubs-embed">
    <iframe id="geoclubs" src="index.html" title="GeoClubs — le GeoGuessr du football mondial"
            loading="lazy" allow="clipboard-write; web-share"></iframe>
  </div>

  <footer>La hauteur est synchronisée via <code>postMessage</code> — voir le script ci-dessous.</footer>
</main>

<script>
(function () {
  var f = document.getElementById('geoclubs');
  // L'origine du jeu, déduite du src : rien à retoucher si l'adresse change.
  var ORIGINE = new URL(f.src, location.href).origin;

  // On annonce au jeu l'adresse de CETTE page, pour que ses boutons de partage
  // renvoient ici. Ciblé sur son origine : avec '*', l'URL partirait vers
  // n'importe quel site ayant pris la place de l'iframe.
  function annoncer() {
    try { f.contentWindow.postMessage({ type: 'geoclubs:parent', url: location.href }, ORIGINE); } catch (e) {}
  }
  f.addEventListener('load', annoncer); annoncer();

  // Le jeu renvoie sa hauteur : l'accueil, une manche et l'écran final
  // n'occupent pas la même place.
  addEventListener('message', function (e) {
    if (e.origin !== ORIGINE) return;           // l'expéditeur doit être le jeu
    if (e.source !== f.contentWindow) return;   // et cette iframe précisément
    if (!e.data || e.data.type !== 'geoclubs:height') return;
    var h = Number(e.data.height);              // jamais la valeur brute
    if (!isFinite(h) || !(h > 0)) return;       // null devient 0, pas une hauteur
    f.style.height = Math.min(4000, Math.max(600, Math.round(h) + 8)) + 'px';
  });
})();
</script>
</body>
</html>
